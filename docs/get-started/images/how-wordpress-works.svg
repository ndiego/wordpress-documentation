<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">How a WordPress page is built</title>
<desc id="d">Content such as posts, pages, media and comments is made of blocks. A template from the theme places those blocks, together with template parts such as the header and footer. The theme's styles set colors, fonts, spacing and layout. The result is the page a visitor sees. Plugins can add blocks and features at every step. Content and settings are stored in the database; WordPress, themes, plugins and uploads are stored as files.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3858e9"/></marker></defs>
<text x="480" y="52" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#1e1e1e">How a WordPress page is built</text>
<text x="480" y="84" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#50575e">Your content is made of blocks, placed by a template and styled by the theme.</text>
