name: Validate

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Front matter, Markdown rules, links and images
        run: python3 -I scripts/validate.py
      - name: Manifest is up to date
        run: python3 -I scripts/build-manifest.py --check
      - name: Anchors (report only)
        run: python3 -I scripts/check-links.py || true
