name: Publish

# On every push to trunk: rebuild manifest.json if the tree changed, then tell the site to import.
# The site pulls the manifest and the changed files itself; nothing is pushed to it but a ping.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the manifest
        run: python3 -I scripts/build-manifest.py
      - name: Validate
        run: python3 -I scripts/validate.py --quiet
      - name: Commit the manifest if it changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "Rebuild manifest.json"
          file_pattern: manifest.json
      - name: Notify the site
        if: ${{ vars.WP_DOCS_SITE_URL != '' }}
        env:
          SITE: ${{ vars.WP_DOCS_SITE_URL }}
          SECRET: ${{ secrets.WP_DOCS_WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "X-WP-Docs-Secret: $SECRET" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}"}' \
            "$SITE/wp-json/wp-docs/v1/import"
